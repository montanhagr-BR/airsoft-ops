<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airsoft Ops - Teste Integrado</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #050708;
      color: #e8f0ed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050708; }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid #2b3a3d;
      background: #081012;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1, p { margin: 0; }
    h1 { font-size: 18px; text-transform: uppercase; }
    p { color: #8fa09a; font-size: 12px; margin-top: 3px; }
    button {
      min-height: 40px;
      border: 1px solid #446050;
      background: #14221d;
      color: #34d399;
      padding: 8px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    main {
      display: grid;
      grid-template-columns: minmax(420px, 1.1fr) minmax(430px, 1fr) minmax(340px, .72fr);
      gap: 10px;
      padding: 10px;
      min-width: 0;
    }
    .screen {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(760px, calc(100vh - 110px));
      border: 1px solid #2b3a3d;
      background: #090d0f;
      overflow: hidden;
    }
    .screenTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-bottom: 1px solid #2b3a3d;
      color: #c4d2ce;
      font: 800 12px Consolas, monospace;
      text-transform: uppercase;
    }
    .screenTitle span:last-child { color: #34d399; }
    iframe { width: 100%; height: 100%; border: 0; background: #050708; }
    @media (max-width: 1280px) {
      main { grid-template-columns: 1fr 1fr; }
      .screen.player { grid-column: 1 / -1; grid-template-rows: auto 820px; }
    }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .screen.player { grid-column: auto; }
      .screen { grid-template-rows: auto 820px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Airsoft Ops · Teste integrado</h1>
      <p>As três telas compartilham o mesmo estado. Alterações aparecem automaticamente nos outros painéis.</p>
    </div>
    <button id="reloadAll" type="button">Recarregar telas</button>
  </header>
  <main>
    <section class="screen">
      <div class="screenTitle"><span>01 · Controlador</span><span>Controle</span></div>
      <iframe src="controle.html" title="Controle do Controlador"></iframe>
    </section>
    <section class="screen">
      <div class="screenTitle"><span>02 · Artefato</span><span>Tablet</span></div>
      <iframe src="bomba.html" title="Tela do artefato"></iframe>
    </section>
    <section class="screen player">
      <div class="screenTitle"><span>03 · Operador</span><span>Celular</span></div>
      <iframe src="jogador.html" title="Terminal do jogador"></iframe>
    </section>
  </main>
  <script>
    reloadAll.onclick = () => {
      document.querySelectorAll('iframe').forEach(frame => {
        frame.contentWindow.location.reload();
      });
    };
  </script>
</body>
</html>
